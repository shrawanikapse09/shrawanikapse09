<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <defs>
    <linearGradient id="stack_bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="50%" stop-color="#0a1125"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>

    <linearGradient id="stack_border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ff354f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0.3"/>
    </linearGradient>

    <radialGradient id="stack_nucleus_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="60%" stop-color="#ff354f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#070b16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes stack_orbit1 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes stack_orbit2 {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes stack_pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.8; }
    }

    .stack_font_main {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
    }
    .stack_font_mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }

    .stack_node_pulse {
      animation: stack_pulse 3s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .stack_node_pulse {
        animation: none !important;
      }
    }
  </style>

  <!-- Background Base -->
  <rect width="850" height="500" rx="20" fill="url(#stack_bg_grad)" stroke="url(#stack_border_grad)" stroke-width="1.2"/>

  <!-- ================= SECTION HEADER ================= -->
  <g transform="translate(40, 35)">
    <rect width="185" height="22" rx="11" fill="#0d182e" stroke="#247bff" stroke-width="0.8"/>
    <text class="stack_font_mono" x="14" y="15" fill="#60a5fa" font-size="10" font-weight="700" letter-spacing="1">TECHNICAL ARSENAL</text>
    <text class="stack_font_main" x="0" y="44" fill="#ffffff" font-size="20" font-weight="800" letter-spacing="0.5">VERIFIED SKILLS &amp; ARCHITECTURES</text>
  </g>

  <!-- ================= LEFT COLUMN: 3 TILTED ELLIPTICAL ORBITS ================= -->
  <g transform="translate(205, 290)">
    <!-- Orbit 3: Outer Tilted Orbit (-28 deg) -->
    <g transform="rotate(-28)">
      <ellipse cx="0" cy="0" rx="165" ry="85" fill="none" stroke="#247bff" stroke-width="1" stroke-dasharray="5 5" opacity="0.4"/>
      <!-- Nodes on Outer Orbit -->
      <g transform="translate(155, 25)">
        <circle cx="0" cy="0" r="14" fill="#0c1833" stroke="#ff354f" stroke-width="1.2"/>
        <text class="stack_font_mono" x="0" y="4" fill="#f43f5e" font-size="9" font-weight="700" text-anchor="middle">Git</text>
      </g>
      <g transform="translate(-155, -25)">
        <circle cx="0" cy="0" r="16" fill="#0c1833" stroke="#247bff" stroke-width="1.2"/>
        <text class="stack_font_mono" x="0" y="4" fill="#38bdf8" font-size="8.5" font-weight="700" text-anchor="middle">React</text>
      </g>
      <g transform="translate(15, -83)">
        <circle cx="0" cy="0" r="15" fill="#0c1833" stroke="#ff354f" stroke-width="1.2"/>
        <text class="stack_font_mono" x="0" y="4" fill="#f43f5e" font-size="8" font-weight="700" text-anchor="middle">Streamlit</text>
      </g>
      <g transform="translate(-20, 83)">
        <circle cx="0" cy="0" r="15" fill="#0c1833" stroke="#247bff" stroke-width="1.2"/>
        <text class="stack_font_mono" x="0" y="4" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">MySQL</text>
      </g>
    </g>

    <!-- Orbit 2: Middle Tilted Orbit (22 deg) -->
    <g transform="rotate(22)">
      <ellipse cx="0" cy="0" rx="120" ry="62" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.5"/>
      <!-- Nodes on Middle Orbit -->
      <g transform="translate(112, 18)">
        <circle cx="0" cy="0" r="16" fill="#0c1833" stroke="#818cf8" stroke-width="1.2"/>
        <text class="stack_font_mono" x="0" y="4" fill="#a5b4fc" font-size="8" font-weight="700" text-anchor="middle">Gemini</text>
      </g>
      <g transform="translate(-112, -18)">
        <circle cx="0" cy="0" r="16" fill="#0c1833" stroke="#818cf8" stroke-width="1.2"/>
        <text class="stack_font_mono" x="0" y="4" fill="#a5b4fc" font-size="7.5" font-weight="700" text-anchor="middle">Chroma</text>
      </g>
      <g transform="translate(15, -60)">
        <circle cx="0" cy="0" r="15" fill="#0c1833" stroke="#247bff" stroke-width="1.2"/>
        <text class="stack_font_mono" x="0" y="4" fill="#38bdf8" font-size="7.5" font-weight="700" text-anchor="middle">LangChain</text>
      </g>
      <g transform="translate(-15, 60)">
        <circle cx="0" cy="0" r="15" fill="#0c1833" stroke="#06b6d4" stroke-width="1.2"/>
        <text class="stack_font_mono" x="0" y="4" fill="#22d3ee" font-size="8" font-weight="700" text-anchor="middle">FastAPI</text>
      </g>
    </g>

    <!-- Orbit 1: Inner Tilted Orbit (-12 deg) -->
    <g transform="rotate(-12)">
      <ellipse cx="0" cy="0" rx="72" ry="38" fill="none" stroke="#ff354f" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
      <!-- Nodes on Inner Orbit -->
      <g transform="translate(68, 8)">
        <circle cx="0" cy="0" r="14" fill="#0c1833" stroke="#38bdf8" stroke-width="1.2"/>
        <text class="stack_font_mono" x="0" y="4" fill="#60a5fa" font-size="8" font-weight="700" text-anchor="middle">Python</text>
      </g>
      <g transform="translate(-68, -8)">
        <circle cx="0" cy="0" r="13" fill="#0c1833" stroke="#f43f5e" stroke-width="1.2"/>
        <text class="stack_font_mono" x="0" y="4" fill="#f43f5e" font-size="8" font-weight="700" text-anchor="middle">C++</text>
      </g>
      <g transform="translate(0, -36)">
        <circle cx="0" cy="0" r="13" fill="#0c1833" stroke="#fbbf24" stroke-width="1.2"/>
        <text class="stack_font_mono" x="0" y="4" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">Java</text>
      </g>
      <g transform="translate(0, 36)">
        <circle cx="0" cy="0" r="13" fill="#0c1833" stroke="#facc15" stroke-width="1.2"/>
        <text class="stack_font_mono" x="0" y="4" fill="#facc15" font-size="8" font-weight="700" text-anchor="middle">JS</text>
      </g>
    </g>

    <!-- Central Glowing Core -->
    <circle class="stack_node_pulse" cx="0" cy="0" r="26" fill="url(#stack_nucleus_glow)"/>
    <circle cx="0" cy="0" r="19" fill="#081022" stroke="#247bff" stroke-width="1.5"/>
    <text class="stack_font_mono" x="0" y="3" fill="#ffffff" font-size="10.5" font-weight="800" text-anchor="middle">SK</text>
    <text class="stack_font_mono" x="0" y="11" fill="#60a5fa" font-size="6" font-weight="700" text-anchor="middle">CORE</text>
  </g>

  <!-- ================= RIGHT COLUMN: GROUPED STACK CHIPS ================= -->
  <g transform="translate(420, 95)">
    <!-- Container Card -->
    <rect width="390" height="375" rx="16" fill="#0a1224" stroke="url(#stack_border_grad)" stroke-width="1.3"/>

    <!-- Group 1: Programming Languages -->
    <g transform="translate(20, 20)">
      <text class="stack_font_mono" x="0" y="0" fill="#60a5fa" font-size="10.5" font-weight="700" letter-spacing="0.5">LANGUAGES &amp; RUNTIMES</text>
      <g transform="translate(0, 10)">
        <!-- Python -->
        <rect width="78" height="26" rx="8" fill="#0f1f3d" stroke="#247bff" stroke-width="0.8"/>
        <circle cx="12" cy="13" r="3.5" fill="#3b82f6"/>
        <text class="stack_font_main" x="22" y="17" fill="#f1f5f9" font-size="11" font-weight="600">Python</text>
        <!-- Java -->
        <g transform="translate(86, 0)">
          <rect width="66" height="26" rx="8" fill="#0f1f3d" stroke="#1e293b" stroke-width="0.8"/>
          <circle cx="12" cy="13" r="3.5" fill="#f59e0b"/>
          <text class="stack_font_main" x="22" y="17" fill="#f1f5f9" font-size="11" font-weight="600">Java</text>
        </g>
        <!-- C++ -->
        <g transform="translate(160, 0)">
          <rect width="64" height="26" rx="8" fill="#0f1f3d" stroke="#1e293b" stroke-width="0.8"/>
          <circle cx="12" cy="13" r="3.5" fill="#ef4444"/>
          <text class="stack_font_main" x="22" y="17" fill="#f1f5f9" font-size="11" font-weight="600">C++</text>
        </g>
        <!-- JavaScript -->
        <g transform="translate(232, 0)">
          <rect width="98" height="26" rx="8" fill="#0f1f3d" stroke="#1e293b" stroke-width="0.8"/>
          <circle cx="12" cy="13" r="3.5" fill="#eab308"/>
          <text class="stack_font_main" x="22" y="17" fill="#f1f5f9" font-size="11" font-weight="600">JavaScript</text>
        </g>
      </g>
    </g>

    <!-- Group 2: AI / ML / NLP & LLMs -->
    <g transform="translate(20, 88)">
      <text class="stack_font_mono" x="0" y="0" fill="#a855f7" font-size="10.5" font-weight="700" letter-spacing="0.5">AI / ML / NLP &amp; LLM SYSTEMS</text>
      <g transform="translate(0, 10)">
        <!-- Google Gemini -->
        <rect width="112" height="26" rx="8" fill="#17122b" stroke="#8b5cf6" stroke-width="0.8"/>
        <circle cx="12" cy="13" r="3.5" fill="#a78bfa"/>
        <text class="stack_font_main" x="22" y="17" fill="#f1f5f9" font-size="11" font-weight="600">Google Gemini</text>
        <!-- LangChain -->
        <g transform="translate(120, 0)">
          <rect width="90" height="26" rx="8" fill="#17122b" stroke="#8b5cf6" stroke-width="0.8"/>
          <circle cx="12" cy="13" r="3.5" fill="#a78bfa"/>
          <text class="stack_font_main" x="22" y="17" fill="#f1f5f9" font-size="11" font-weight="600">LangChain</text>
        </g>
        <!-- RAG Pipelines -->
        <g transform="translate(218, 0)">
          <rect width="116" height="26" rx="8" fill="#17122b" stroke="#8b5cf6" stroke-width="0.8"/>
          <circle cx="12" cy="13" r="3.5" fill="#ec4899"/>
          <text class="stack_font_main" x="22" y="17" fill="#f1f5f9" font-size="11" font-weight="600">RAG Pipelines</text>
        </g>
      </g>
      <!-- Row 2 of AI -->
      <g transform="translate(0, 42)">
        <!-- ChromaDB -->
        <rect width="92" height="26" rx="8" fill="#17122b" stroke="#1e293b" stroke-width="0.8"/>
        <circle cx="12" cy="13" r="3.5" fill="#06b6d4"/>
        <text class="stack_font_main" x="22" y="17" fill="#f1f5f9" font-size="11" font-weight="600">ChromaDB</text>
        <!-- TensorFlow -->
        <g transform="translate(100, 0)">
          <rect width="98" height="26" rx="8" fill="#17122b" stroke="#1e293b" stroke-width="0.8"/>
          <circle cx="12" cy="13" r="3.5" fill="#f97316"/>
          <text class="stack_font_main" x="22" y="17" fill="#f1f5f9" font-size="11" font-weight="600">TensorFlow</text>
        </g>
        <!-- scikit-learn -->
        <g transform="translate(206, 0)">
          <rect width="98" height="26" rx="8" fill="#17122b" stroke="#1e293b" stroke-width="0.8"/>
          <circle cx="12" cy="13" r="3.5" fill="#38bdf8"/>
          <text class="stack_font_main" x="22" y="17" fill="#f1f5f9" font-size="11" font-weight="600">scikit-learn</text>
        </g>
      </g>
    </g>

    <!-- Group 3: Web & Backend -->
    <g transform="translate(20, 192)">
      <text class="stack_font_mono" x="0" y="0" fill="#38bdf8" font-size="10.5" font-weight="700" letter-spacing="0.5">FULL STACK &amp; BACKEND</text>
      <g transform="translate(0, 10)">
        <!-- FastAPI -->
        <rect width="78" height="26" rx="8" fill="#0f1f3d" stroke="#0284c7" stroke-width="0.8"/>
        <circle cx="12" cy="13" r="3.5" fill="#0284c7"/>
        <text class="stack_font_main" x="22" y="17" fill="#f1f5f9" font-size="11" font-weight="600">FastAPI</text>
        <!-- React -->
        <g transform="translate(86, 0)">
          <rect width="70" height="26" rx="8" fill="#0f1f3d" stroke="#0284c7" stroke-width="0.8"/>
          <circle cx="12" cy="13" r="3.5" fill="#38bdf8"/>
          <text class="stack_font_main" x="22" y="17" fill="#f1f5f9" font-size="11" font-weight="600">React</text>
        </g>
        <!-- Streamlit -->
        <g transform="translate(164, 0)">
          <rect width="86" height="26" rx="8" fill="#0f1f3d" stroke="#1e293b" stroke-width="0.8"/>
          <circle cx="12" cy="13" r="3.5" fill="#ff354f"/>
          <text class="stack_font_main" x="22" y="17" fill="#f1f5f9" font-size="11" font-weight="600">Streamlit</text>
        </g>
        <!-- HTML5/CSS3 -->
        <g transform="translate(258, 0)">
          <rect width="90" height="26" rx="8" fill="#0f1f3d" stroke="#1e293b" stroke-width="0.8"/>
          <circle cx="12" cy="13" r="3.5" fill="#f97316"/>
          <text class="stack_font_main" x="22" y="17" fill="#f1f5f9" font-size="11" font-weight="600">HTML/CSS</text>
        </g>
      </g>
    </g>

    <!-- Group 4: Databases & Tools -->
    <g transform="translate(20, 268)">
      <text class="stack_font_mono" x="0" y="0" fill="#10b981" font-size="10.5" font-weight="700" letter-spacing="0.5">DATABASES &amp; DEVELOPER TOOLS</text>
      <g transform="translate(0, 10)">
        <!-- MySQL -->
        <rect width="76" height="26" rx="8" fill="#0d2426" stroke="#10b981" stroke-width="0.8"/>
        <circle cx="12" cy="13" r="3.5" fill="#10b981"/>
        <text class="stack_font_main" x="22" y="17" fill="#f1f5f9" font-size="11" font-weight="600">MySQL</text>
        <!-- Git -->
        <g transform="translate(84, 0)">
          <rect width="60" height="26" rx="8" fill="#0d2426" stroke="#1e293b" stroke-width="0.8"/>
          <circle cx="12" cy="13" r="3.5" fill="#f43f5e"/>
          <text class="stack_font_main" x="22" y="17" fill="#f1f5f9" font-size="11" font-weight="600">Git</text>
        </g>
        <!-- GitHub -->
        <g transform="translate(152, 0)">
          <rect width="78" height="26" rx="8" fill="#0d2426" stroke="#1e293b" stroke-width="0.8"/>
          <circle cx="12" cy="13" r="3.5" fill="#e2e8f0"/>
          <text class="stack_font_main" x="22" y="17" fill="#f1f5f9" font-size="11" font-weight="600">GitHub</text>
        </g>
        <!-- VS Code -->
        <g transform="translate(238, 0)">
          <rect width="84" height="26" rx="8" fill="#0d2426" stroke="#1e293b" stroke-width="0.8"/>
          <circle cx="12" cy="13" r="3.5" fill="#38bdf8"/>
          <text class="stack_font_main" x="22" y="17" fill="#f1f5f9" font-size="11" font-weight="600">VS Code</text>
        </g>
      </g>
    </g>

    <!-- Bottom summary tag -->
    <g transform="translate(20, 342)">
      <text class="stack_font_mono" x="0" y="0" fill="#64748b" font-size="9.5">PROVEN IN DEPLOYED RAG &amp; FULL-STACK SYSTEMS</text>
    </g>
  </g>
</svg>